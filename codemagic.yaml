workflows:
  rapidfire-android-apk:
    name: RapidFire Panel — Android APK
    max_build_duration: 30
    environment:
      node: 20.17.0
      java: 17

    scripts:
      # ── Step 1: Install only what Gradle needs ─────────────────────
      - name: Install Capacitor Android dependency
        script: |
          cd $CM_BUILD_DIR/..
          npm install --ignore-scripts --prefer-offline \
            @capacitor/android \
            @capacitor/core \
            @capacitor/cli

      # ── Step 2: Build APK ──────────────────────────────────────────
      - name: Build Android APK
        script: |
          cd $CM_BUILD_DIR
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your@email.com         # <-- Change to your email
        notify:
          success: true
          failure: true
