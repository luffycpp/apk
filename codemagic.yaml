workflows:
  rapidfire-android-apk:
    name: RapidFire Panel — Android APK
    max_build_duration: 30
    environment:
      node: 20.17.0
      java: 21

    scripts:
      # ── Step 1: Verify Java version ────────────────────────────────
      - name: Check Java version
        script: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          # Find actual Java 21 path on Codemagic and export it
          JAVA21=$(ls /Library/Java/JavaVirtualMachines/ | grep -i "21" | head -1)
          if [ -n "$JAVA21" ]; then
            export JAVA_HOME="/Library/Java/JavaVirtualMachines/$JAVA21/Contents/Home"
            echo "Found Java 21 at: $JAVA_HOME"
          fi

      # ── Step 2: Install Capacitor deps ─────────────────────────────
      - name: Install Capacitor Android dependency
        script: |
          cd $CM_BUILD_DIR/..
          npm install --ignore-scripts \
            @capacitor/android \
            @capacitor/core

      # ── Step 3: Build APK ──────────────────────────────────────────
      - name: Build Android APK
        script: |
          # Set Java 21 explicitly
          JAVA21=$(ls /Library/Java/JavaVirtualMachines/ | grep -i "21" | head -1)
          if [ -n "$JAVA21" ]; then
            export JAVA_HOME="/Library/Java/JavaVirtualMachines/$JAVA21/Contents/Home"
            # Update gradle.properties with actual path
            sed -i '' "s|org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" gradle.properties
          fi
          echo "Building with JAVA_HOME=$JAVA_HOME"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
